name: booking-postgres

on:
  push:
    branches: [main, backend/booking-consistency]
  pull_request:

permissions:
  contents: read

jobs:
  booking:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: britva_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: britva_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U britva_test -d britva_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python booking_test.py
        env:
          BRITVA_TEST_POSTGRES_URL: postgresql://britva_test:disposable_test_password@127.0.0.1:5432/britva_test_ci
